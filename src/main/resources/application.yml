spring:
  application:
    name: controle-gastos-api-java
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gastos}
    username: ${DB_USER:gastos}
    password: ${DB_PASSWORD:gastos}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8092}

# origens do frontend, separadas por virgula
app:
  cors:
    origens: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

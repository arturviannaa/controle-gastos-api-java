name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # o runner ja tem Docker, entao os testes de Testcontainers rodam aqui
      - name: Build e testes
        run: ./mvnw -B verify

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  imagem-docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # so valida que a imagem constroi; publicar registry fica para o deploy
      - name: Build da imagem da API
        run: docker build -t controle-gastos-api:${{ github.sha }} .

      - name: Build da imagem do frontend
        run: docker build -t controle-gastos-frontend:${{ github.sha }} ./frontend

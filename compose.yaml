services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gastos
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gastos}
    ports:
      - "5434:5432"   # porta alta no host para nao colidir com outro Postgres
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastos -d gastos"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/gastos
      DB_USER: gastos
      DB_PASSWORD: ${DB_PASSWORD:-gastos}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8092:8092"
    depends_on:
      db:
        # so sobe depois que o banco aceita conexao, senao o Flyway falha
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8092/api}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dados-postgres:
